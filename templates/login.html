{% extends "base.html" %}
{% block title %}Login - AI Interview Analyser{% endblock %}
{% block content %}
  <h2>Login</h2>
  <form method="post">
    <label>Username: <input name="username" type="text"></label><br>
    <label>Password: <input name="password" type="password"></label><br>
    <button type="submit">Login</button>
  </form>
  <p>If you don't have an account, use the Register mode on the same form by adding a `mode=register` hidden input when needed.</p>
{% endblock %}
